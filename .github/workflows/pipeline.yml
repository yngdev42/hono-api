name : "Hono CI"

on: 
  push:
    branches: 
      - "main" 
      - "dev"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test